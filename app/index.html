<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>じかんのToDo</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body>
<div class="shell"><header><span class="brand">◷ じかんのToDo</span><span class="badge">試作版</span></header><aside class="notice">データはこのブラウザ内に保存されます。共有・同期はありません。</aside><div id="alert" role="alert"></div><div id="running"></div><main id="main"></main><nav aria-label="共通メニュー"><button data-nav="home">⌂<span>ホーム</span></button><button data-nav="list">☷<span>一覧</span></button><button data-nav="result">▥<span>結果</span></button><button data-nav="timer">◷<span>計測</span></button></nav></div>
<dialog id="editor"><form id="form" novalidate><h2 id="form-title"></h2><div id="fields"></div><p id="form-error" role="alert"></p><div class="actions"><button type="button" id="cancel">キャンセル</button><button class="primary" type="submit">保存</button></div><div id="leave" hidden><p>入力が保存されていません。</p><button type="button" id="save-leave">保存して移動</button><button type="button" id="discard">破棄して移動</button><button type="button" id="continue">編集を続ける</button></div></form></dialog>
</body></html>
