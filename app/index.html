<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>じかんのToDo</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head><body>
<div class="shell"><header><span class="brand"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>じかんのToDo</span><span class="badge">試作版</span></header><aside class="notice">データはこのブラウザ内に保存されます。共有・同期はありません。</aside><div id="alert" role="alert"></div><div id="running"></div><main id="main"></main><nav aria-label="共通メニュー"><button data-nav="home"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m4 11 8-7 8 7v9h-6v-6h-4v6H4z"/></svg><span>ホーム</span></button><button data-nav="list"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg><span>一覧</span></button><button data-nav="result"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>結果</span></button><button data-nav="timer"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v5l3 2M9 2h6"/></svg><span>計測</span></button></nav></div>
<dialog id="editor"><form id="form" novalidate><h2 id="form-title"></h2><div id="fields"></div><p id="form-error" role="alert"></p><div class="actions"><button type="button" id="cancel">キャンセル</button><button class="primary" type="submit">保存</button></div><div id="leave" hidden><p>入力が保存されていません。</p><button type="button" id="save-leave">保存して移動</button><button type="button" id="discard">破棄して移動</button><button type="button" id="continue">編集を続ける</button></div></form></dialog>
</body></html>
